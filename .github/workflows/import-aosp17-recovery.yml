name: Import verified AOSP 17 Recovery sources

on:
  push:
    branches:
      - ci/a17-recovery-import-20261103
    paths:
      - .github/workflows/import-aosp17-recovery.yml

permissions:
  contents: write

concurrency:
  group: import-aosp17-recovery
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      AOSP_URL: https://android.googlesource.com/platform/bootable/recovery
      AOSP_REF: refs/tags/android-17.0.0_r1
      EXPECTED_COMMIT: 080f671785c84ae1ac38797fe1fa7364d158fab4
      EXPECTED_TREE: 08502f068321cd5d00b80a189b2362e6b2bbc5da
      OUTPUT_BRANCH: port/a17-recovery-aosp17-base-20261103
    steps:
      - name: Verify official Android 17 tag and complete source tree
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/aosp-recovery"
          mkdir -p "$work"
          git -C "$work" init -q
          git -C "$work" remote add official "$AOSP_URL"
          git -C "$work" fetch --no-tags official "$AOSP_REF"
          commit="$(git -C "$work" rev-parse 'FETCH_HEAD^{commit}')"
          tree="$(git -C "$work" rev-parse "$commit^{tree}")"
          test "$commit" = "$EXPECTED_COMMIT" || { echo "Unexpected release commit $commit"; exit 1; }
          test "$tree" = "$EXPECTED_TREE" || { echo "Unexpected release tree $tree"; exit 1; }
          git -C "$work" fsck --connectivity-only --no-reflogs
          echo "Verified official AOSP17 recovery: $commit / $tree"

      - name: Publish AOSP17 sources, preserve PE legacy branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/aosp-recovery"
          destination="https://github.com/$GITHUB_REPOSITORY.git"
          ref="refs/heads/$OUTPUT_BRANCH"
          current="$(git ls-remote "$destination" "$ref" | cut -f1)"
          if [[ -n "$current" ]]; then
            echo "Ref already exists at $current; refusing overwrite"
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

          set +e
          git -C "$work" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --no-thin "$destination" "$EXPECTED_COMMIT:$ref" \
            > "$RUNNER_TEMP/import.log" 2>&1
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "Imported full official Git history, unchanged AOSP commit"
            exit 0
          fi
          tail -n 12 "$RUNNER_TEMP/import.log"
          if ! grep -Eq "GH001|exceeds GitHub.s file size limit" "$RUNNER_TEMP/import.log"; then
            echo "Unexpected Git upload failure, no substitute created"
            exit "$status"
          fi

          # Only when old unreachable-from-release-contents history is too big:
          # preserve the exact current AOSP17 source tree in a root commit.
          oversized="$(git -C "$work" ls-tree -r -l "$EXPECTED_COMMIT" |
            awk '$2 == "blob" && $4 ~ /^[0-9]+$/ && $4 > 100000000 {print}')"
          if [[ -n "$oversized" ]]; then
            echo "Current source has >100MB objects, refusing a partial import:"
            echo "$oversized"
            exit 1
          fi
          {
            echo "Import exact AOSP 17 Recovery source snapshot"
            echo
            echo "Official release tag: android-17.0.0_r1"
            echo "Official commit: $EXPECTED_COMMIT"
            echo "Unmodified source tree: $EXPECTED_TREE"
            echo "Official source: $AOSP_URL"
            echo
            echo "The full historical Git push was rejected for oversized"
            echo "legacy blobs. This root commit preserves exact release files."
            echo "Old PixelExperience commits remain intact on seventeen."
          } > "$RUNNER_TEMP/source-message.txt"
          snapshot="$(GIT_AUTHOR_NAME='github-actions[bot]' \
            GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            GIT_COMMITTER_NAME='github-actions[bot]' \
            GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            git -C "$work" commit-tree "$EXPECTED_TREE" -F "$RUNNER_TEMP/source-message.txt")"
          test "$(git -C "$work" rev-parse "$snapshot^{tree}")" = "$EXPECTED_TREE"
          git -C "$work" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --no-thin "$destination" "$snapshot:$ref"
          echo "Imported exact AOSP17 recovery file tree in root snapshot"
